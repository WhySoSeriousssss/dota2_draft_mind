<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Draft Score V1</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>Draft Score V1</h1>
      <span>Dota 2 Ranked Draft Assistant</span>
    </div>
    <div class="data-status" id="dataStatus">正在连接基础数据</div>
  </header>

  <nav class="mobile-tabs" aria-label="移动端视图">
    <button type="button" class="active" data-view="draft">阵容</button>
    <button type="button" data-view="results">推荐</button>
  </nav>

  <main class="workspace">
    <aside class="draft-panel">
      <section class="section">
        <div class="section-heading"><h2>比赛参数</h2></div>
        <label class="field-label" for="rankSelect">分段</label>
        <select class="rank-select" id="rankSelect"></select>
        <div class="weights">
          <label class="weight-control">
            <span class="weight-title"><span>基础 α</span><output id="alphaValue">1.00</output></span>
            <input id="alphaInput" type="range" min="0" max="2" step="0.05" value="1">
          </label>
          <label class="weight-control">
            <span class="weight-title"><span>对位 β</span><output id="betaValue">0.50</output></span>
            <input id="betaInput" type="range" min="0" max="2" step="0.05" value="0.5">
          </label>
          <label class="weight-control">
            <span class="weight-title"><span>协同 γ</span><output id="gammaValue">0.80</output></span>
            <input id="gammaInput" type="range" min="0" max="2" step="0.05" value="0.8">
          </label>
        </div>
      </section>

      <section class="section">
        <div class="section-heading"><h2>当前阵容</h2></div>
        <div class="teams">
          <div class="team-column" data-side="ally">
            <div class="team-heading"><span>我方</span><span id="allyCount">0 / 4</span></div>
            <div class="pick-list" id="allyPicks"></div>
          </div>
          <div class="team-column" data-side="enemy">
            <div class="team-heading"><span>敌方</span><span id="enemyCount">0 / 5</span></div>
            <div class="pick-list" id="enemyPicks"></div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-heading">
          <h2>英雄池</h2>
          <div class="side-switch" aria-label="选择加入阵营">
            <button type="button" class="active" data-side="ally">我方</button>
            <button type="button" data-side="enemy">敌方</button>
          </div>
        </div>
        <div class="pool-toolbar">
          <input class="hero-search" id="heroSearch" type="search" placeholder="搜索英雄" autocomplete="off">
        </div>
        <div class="attr-filter" id="attrFilter">
          <button type="button" class="active" data-attr="all">全部</button>
          <button type="button" data-attr="str">力量</button>
          <button type="button" data-attr="agi">敏捷</button>
          <button type="button" data-attr="int">智力</button>
          <button type="button" data-attr="all_attr">全才</button>
        </div>
        <div class="hero-pool" id="heroPool"></div>
      </section>
    </aside>

    <section class="results-panel mobile-hidden">
      <div class="results-heading">
        <div class="results-title-group">
          <h2>推荐英雄</h2>
          <div class="results-meta" id="resultsMeta">等待基础数据</div>
        </div>
        <button class="calculate-button" id="calculateButton" type="button">计算推荐</button>
      </div>
      <div class="message-bar" id="messageBar" role="alert"></div>
      <div id="resultsContainer">
        <div class="empty-results">正在载入英雄数据</div>
      </div>
    </section>
  </main>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
